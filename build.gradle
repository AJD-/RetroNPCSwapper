plugins {
	id 'java'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(11)
	}
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.retronpcswapper.RetroNpcSwapperPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'
	testCompileOnly 'org.projectlombok:lombok:1.18.30'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
	// Dev tooling only - decodes the live OSRS cache for ModernNpcDumper. Never shipped: the
	// plugin jar is built from the main sourceSet, which does not reference it.
	testImplementation(group: 'net.runelite', name:'cache', version: runeLiteVersion) {
		// The client already brings logback; without this every run warns about two bindings
		exclude group: 'org.slf4j', module: 'slf4j-simple'
	}
}

group = 'com.retronpcswapper'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "--add-opens=java.base/java.lang=ALL-UNNAMED",
			"--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
			"--add-opens=java.base/java.util=ALL-UNNAMED",
			"--add-exports=java.base/sun.security.action=ALL-UNNAMED",
			"--add-exports=java.desktop/sun.awt=ALL-UNNAMED",
			"--add-exports=java.desktop/sun.font=ALL-UNNAMED",
			"-ea"
	args "--developer-mode", "--debug", "--disable-telemetry"
}

tasks.register('generateNpcMappings', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.retronpcswapper.cache.NpcMappingGenerator'
	workingDir = rootDir
}

// Prints NPC definitions from the live OSRS cache, eg:
//   ./gradlew dumpNpcDefinitions -Pnpc=1173
//   ./gradlew dumpNpcDefinitions -Pnpc=chicken -PcacheDir=/path/to/LIVE
tasks.register('dumpNpcDefinitions', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.retronpcswapper.cache.ModernNpcDumper'
	workingDir = rootDir

	if (project.hasProperty('npc')) {
		args project.property('npc').toString().split(',')
	}
	if (project.hasProperty('cacheDir')) {
		systemProperty 'retronpcswapper.cacheDir', project.property('cacheDir')
	}
}

// Compares 2005 model geometry against the live cache, to tell a preserved retro asset from an
// id that was reused, eg:
//   ./gradlew compareRetroModels -Pmodels=2853,2854
//   ./gradlew compareRetroModels -Pmodels=2942,2943 -Pfindmoved
tasks.register('compareRetroModels', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.retronpcswapper.cache.RetroModelComparator'
	workingDir = rootDir

	if (project.hasProperty('models')) {
		args project.property('models').toString().split(',')
	}
	if (project.hasProperty('findmoved')) {
		systemProperty 'retronpcswapper.findmoved', 'true'
	}
	if (project.hasProperty('cacheDir')) {
		systemProperty 'retronpcswapper.cacheDir', project.property('cacheDir')
	}
}

// Gate for injecting 2005 geometry that has no live id: checks that the vertex groups baked into
// the retro mesh are addressed by the framemaps the live sequences name, eg:
//   ./gradlew verifyRetroRigs
//   ./gradlew verifyRetroRigs -Pmodels=2853,2854 -Pseqs=79,90
tasks.register('verifyRetroRigs', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.retronpcswapper.cache.RetroRigVerifier'
	workingDir = rootDir

	if (project.hasProperty('models')) {
		systemProperty 'retronpcswapper.models', project.property('models')
	}
	if (project.hasProperty('seqs')) {
		systemProperty 'retronpcswapper.seqs', project.property('seqs')
	}
	if (project.hasProperty('cacheDir')) {
		systemProperty 'retronpcswapper.cacheDir', project.property('cacheDir')
	}
	if (project.hasProperty('retroDir')) {
		systemProperty 'retronpcswapper.retroDir', project.property('retroDir')
	}
	if (project.hasProperty('scanrig')) {
		systemProperty 'retronpcswapper.scanrig', project.property('scanrig')
	}
	if (project.hasProperty('probeframes')) {
		systemProperty 'retronpcswapper.probeframes', 'true'
	}
	if (project.hasProperty('findclips')) {
		systemProperty 'retronpcswapper.findclips', project.property('findclips')
	}
}

// Builds the shipped asset bundle: injected geometry plus the rigs and clips that animate it.
// Meshes come from whichever cache still has them; clips always come from the live cache.
//   ./gradlew generateRetroAssets
tasks.register('generateRetroAssets', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.retronpcswapper.cache.RetroAssetGenerator'
	workingDir = rootDir

	if (project.hasProperty('cacheDir')) {
		systemProperty 'retronpcswapper.cacheDir', project.property('cacheDir')
	}
	if (project.hasProperty('retroDir')) {
		systemProperty 'retronpcswapper.retroDir', project.property('retroDir')
	}
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
